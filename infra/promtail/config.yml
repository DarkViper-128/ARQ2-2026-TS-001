# FlashTix Promtail Configuration (Phase 4)
# Ships Docker container logs to Loki.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discovers containers of this compose project through the Docker socket. A second job
  # reading /var/lib/docker/containers/*/*log was removed: it scraped EVERY container on
  # the host, including unrelated ones whose old timestamps Loki rejects with HTTP 400.
  - job_name: "flashtix-services"
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=flashtix"]
    relabel_configs:
      - target_label: "cluster"
        replacement: "flashtix-local"
      - target_label: "environment"
        replacement: "development"
      - source_labels: ["__meta_docker_container_name"]
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
    pipeline_stages:
      - docker: {}
      - labels:
          service:
          container:
          project: