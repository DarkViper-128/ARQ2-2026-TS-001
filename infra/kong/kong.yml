# FlashTix API Gateway - declarative configuration (Wave 2, GW-1 to GW-4).
# Kong runs DB-less: this file IS the configuration. Reload with
#   docker compose restart api-gateway
#
# The gateway is the single entry point. Public catalog reads pass through; anything that
# touches a seat requires a valid Keycloak JWT, and the organizer routes also require the
# ORGANIZER role (GW-3). The gateway forwards the caller as X-User-Id, X-User-Email and
# X-User-Roles (GW-4), always overwriting whatever the client sent.
_format_version: "3.0"

services:
  - name: catalog
    url: http://catalog:3000
    retries: 2
    connect_timeout: 2000
    read_timeout: 5000

  - name: waiting-room
    url: http://waiting-room:3000
    retries: 0
    connect_timeout: 2000
    read_timeout: 5000

  - name: order
    url: http://order:3000
    retries: 0
    connect_timeout: 2000
    read_timeout: 5000

  - name: reservation
    url: http://reservation:3000
    retries: 0
    connect_timeout: 2000
    read_timeout: 5000

  - name: ticket
    url: http://ticket:3000
    retries: 0
    connect_timeout: 2000
    read_timeout: 5000

  - name: catalog-admin
    url: http://catalog:3000
    retries: 0
    connect_timeout: 2000
    read_timeout: 10000

  - name: order-admin
    url: http://order:3000
    retries: 0
    connect_timeout: 2000
    read_timeout: 5000

routes:
  # Public catalog routes (no auth) - 100 req/s per IP
  - name: catalog-events
    service: catalog
    paths:
      - ~/v1/events$
      - ~/v1/events/[^/]+$
      - ~/v1/events/[^/]+/seats$
    strip_path: false
    methods: [GET]
    plugins:
      - name: rate-limiting
        config:
          minute: 6000          # 100 req/s per IP
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # Waiting Room routes (require FAN role) - 20 req/s per user
  - name: waiting-room-queue
    service: waiting-room
    paths:
      - ~/v1/events/[^/]+/queue$
      - ~/v1/events/[^/]+/queue/[^/]+$
    strip_path: false
    methods: [POST, GET]
    plugins:
      - name: rate-limiting
        config:
          minute: 1200          # 20 req/s per user (consumer-based when authenticated)
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
      - name: post-function
        config:
          access:
            - &fan_identity |
              local token = (kong.request.get_header("authorization") or ""):match("^[Bb]earer%s+(.+)$")
              local b64 = token and token:match("^[%w_%-]+%.([%w_%-]+)%.")
              if not b64 then
                return kong.response.exit(401, { code = "UNAUTHENTICATED", status = 401, detail = "Malformed bearer token" })
              end
              b64 = b64:gsub("%-", "+"):gsub("_", "/")
              b64 = b64 .. string.rep("=", (4 - #b64 % 4) % 4)
              local json = ngx.decode_base64(b64) or ""
              local sub = json:match('"sub"%s*:%s*"([^"]+)"')
              if not sub then
                return kong.response.exit(401, { code = "UNAUTHENTICATED", status = 401, detail = "Bearer token has no subject" })
              end
              local roles = json:match('"realm_access"%s*:%s*{%s*"roles"%s*:%s*%[(.-)%]') or ""
              local list = {}
              for role in roles:gmatch('"([^"]+)"') do list[#list + 1] = role end
              kong.service.request.set_header("X-User-Id", sub)
              kong.service.request.set_header("X-User-Email", json:match('"email"%s*:%s*"([^"]+)"') or "")
              kong.service.request.set_header("X-User-Roles", table.concat(list, ","))

  # Order routes (require FAN role) - 20 req/s per user
  - name: orders
    service: order
    paths:
      - /v1/orders
    strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 1200          # 20 req/s per user (consumer-based when authenticated)
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
      - name: post-function
        config:
          access:
            - *fan_identity

  # Reservation routes (require FAN role) - 20 req/s per user
  - name: reservation-holds
    service: reservation
    paths:
      - /v1/holds
    strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 1200          # 20 req/s per user (consumer-based when authenticated)
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
      - name: post-function
        config:
          access:
            - *fan_identity

  # Ticket routes (require FAN role) - 20 req/s per user
  - name: tickets
    service: ticket
    paths:
      - ~/v1/tickets/[^/]+$
    strip_path: false
    methods: [GET]
    plugins:
      - name: rate-limiting
        config:
          minute: 1200          # 20 req/s per user (consumer-based when authenticated)
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
      - name: post-function
        config:
          access:
            - *fan_identity

  # Organizer routes (require ORGANIZER role) - 20 req/s per user
  - name: admin-events
    service: catalog-admin
    paths:
      - ~/v1/admin/events$
      - ~/v1/admin/events/[^/]+/publish$
    strip_path: false
    methods: [POST]
    plugins:
      - name: rate-limiting
        config:
          minute: 1200          # 20 req/s per user (consumer-based when authenticated)
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
      - name: post-function
        config:
          access:
            - &organizer_identity |
              local token = (kong.request.get_header("authorization") or ""):match("^[Bb]earer%s+(.+)$")
              local b64 = token and token:match("^[%w_%-]+%.([%w_%-]+)%.")
              if not b64 then
                return kong.response.exit(401, { code = "UNAUTHENTICATED", status = 401, detail = "Malformed bearer token" })
              end
              b64 = b64:gsub("%-", "+"):gsub("_", "/")
              b64 = b64 .. string.rep("=", (4 - #b64 % 4) % 4)
              local json = ngx.decode_base64(b64) or ""
              local sub = json:match('"sub"%s*:%s*"([^"]+)"')
              if not sub then
                return kong.response.exit(401, { code = "UNAUTHENTICATED", status = 401, detail = "Bearer token has no subject" })
              end
              local roles = json:match('"realm_access"%s*:%s*{%s*"roles"%s*:%s*%[(.-)%]') or ""
              if not roles:find('"ORGANIZER"', 1, true) then
                return kong.response.exit(403, { type = "https://api.flashtix.com/errors/forbidden", title = "Forbidden", status = 403, code = "FORBIDDEN", detail = "This endpoint requires the ORGANIZER role" }, { ["Content-Type"] = "application/problem+json" })
              end
              local list = {}
              for role in roles:gmatch('"([^"]+)"') do list[#list + 1] = role end
              kong.service.request.set_header("X-User-Id", sub)
              kong.service.request.set_header("X-User-Email", json:match('"email"%s*:%s*"([^"]+)"') or "")
              kong.service.request.set_header("X-User-Roles", table.concat(list, ","))

  - name: admin-order-refund
    service: order-admin
    paths:
      - ~/v1/admin/orders/[^/]+/refund$
    strip_path: false
    methods: [POST]
    plugins:
      - name: rate-limiting
        config:
          minute: 1200          # 20 req/s per user (consumer-based when authenticated)
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
          run_on_preflight: true
      - name: post-function
        config:
          access:
            - *organizer_identity

consumers:
  # One consumer stands for "any user Keycloak vouched for". Roles are enforced per route
  # by the post-function plugin (GW-3), not here.
  - username: keycloak-flashtix
    jwt_secrets:
      - key: "http://localhost:8080/realms/flashtix"
        algorithm: RS256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA6VGMNi5SjRet63QWMGnM
          CU0sEu2ywewkFCKh8ugXBsYVWv2J/DN5L98T2fn5P27QjUnqqPhya9ZtjTQFn1AY
          bqEJukhYa7wisP8vJAIs1s8+d+7NNtTdIj3Yv0WWYaI/Fsvy7hinHe/RZWicJv95
          cL+UmEsr6Jn60MxbVROaRA/tNyy9LWaXRxzwNll1QfV7r2J2r/9anMp5H+1V9Dpm
          Wjycc/haNeoVyTzGUJP/27X9/uO3M9CWdVFu7i4OCRtJXbYxw884ubScnaAtqIUM
          JcwNriEadlQv8EXR8uXd3ebtFk+vvpi87slCKhI5HPzVc+6VZJ6tToQw3/PqQmsy
          7wIDAQAB
          -----END PUBLIC KEY-----

plugins:
  # Every request gets a correlation id that travels into the services and their events.
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid
      echo_downstream: true

  # Rate limiting is configured per-route:
  #   - Public catalog routes: 100 req/s per IP (minute: 6000)
  #   - Protected routes (waiting-room, order, reservation, ticket, admin):
  #     20 req/s per authenticated user (minute: 1200, consumer-based identification)
  #
  # Kong OSS rate-limiting identifies by consumer when authenticated, by IP when not.
  # Per-user 20 req/s requires the rate-limiting-advanced plugin (Kong Enterprise);
  # this configuration matches the spec as closely as Kong OSS allows.