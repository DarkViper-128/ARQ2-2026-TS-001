# FlashTix broker configuration (Wave 2, INF-4).
#
# The topology is NOT imported with `load_definitions`: that setting makes RabbitMQ skip
# the creation of the RABBITMQ_DEFAULT_USER account, which would leave the broker with no
# way to log in. The `rabbitmq-init` container imports definitions.json over the HTTP API
# once the broker is healthy, so credentials stay in .env.

# Quorum queues need a disk-backed node; keep the defaults conservative for laptops.
vm_memory_high_watermark.relative = 0.6

# Prometheus metrics plugin (Phase 4 observability)
prometheus.tcp.port = 15692
