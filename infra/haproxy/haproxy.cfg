# HAProxy configuration for FlashTix API Gateway
# Provides load balancing in front of Kong API Gateway
# (C4 Level 2: Load Balancer component)

global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout check 5s

# Frontend: public API entry point
frontend fe_api
    bind *:8000
    mode http

    # Health check endpoint (responded by HAProxy directly)
    acl is_health path /health
    http-request return status 200 content-type text/plain string "OK" if is_health

    # Rate limiting can be added here if needed
    # stick-table type ip size 100k expire 30s store http_req_rate(10s)
    # http-request track-sc0 src
    # http-request deny deny_status 429 if { sc_http_req_rate(0) gt 1000 }

    default_backend be_kong

# Backend: Kong API Gateway instances
backend be_kong
    mode http
    balance roundrobin
    # Use TCP check since Kong proxy doesn't have a /health endpoint by default
    # HTTP check on / would work too (404 means Kong is up)
    option httpchk GET /
    http-check expect status 200,301,302,307,400,401,403,404,405,429,500,502,503

    # Single Kong instance for now; add more lines for HA
    server kong1 api-gateway:8000 check inter 10s fall 3 rise 2

    # For multiple Kong instances (production):
    # server kong1 api-gateway-1:8000 check inter 10s fall 3 rise 2
    # server kong2 api-gateway-2:8000 check inter 10s fall 3 rise 2
    # server kong3 api-gateway-3:8000 check inter 10s fall 3 rise 2

# Stats endpoint (optional, for monitoring)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:${HAPROXY_STATS_PASSWORD:-admin}
