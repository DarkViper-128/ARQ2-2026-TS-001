# FlashTix - base infrastructure (Wave 2, Phase 0)
# Containers taken from the C4 Level 2 diagram (docs/assets/c4-container-diagram.jpg).
# The microservices themselves are added in Phase 1; what runs here is everything they
# need in order to be built and demoed: databases, caches, broker, object storage,
# a mail catcher and a stand-in for the legacy payment gateway.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#   docker compose ps

name: flashtix

# Every MySQL database is configured the same way; only the name and port change.
x-mysql: &mysql
  image: mysql:8.4
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s
  networks: [flashtix-net]

services:
  # --- Databases (MySQL 8, one per service that owns data) -------------------
  catalog-db:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: catalog
    ports:
      - "3307:3306"
    volumes:
      - catalog-db-data:/var/lib/mysql
      - ./infra/mysql/catalog:/docker-entrypoint-initdb.d:ro

  booking-db:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: booking
    ports:
      - "3308:3306"
    volumes:
      - booking-db-data:/var/lib/mysql
      - ./infra/mysql/booking:/docker-entrypoint-initdb.d:ro

  payment-db:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: payment
    ports:
      - "3309:3306"
    volumes:
      - payment-db-data:/var/lib/mysql
      - ./infra/mysql/payment:/docker-entrypoint-initdb.d:ro

  ticket-db:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ticket
    ports:
      - "3310:3306"
    volumes:
      - ticket-db-data:/var/lib/mysql
      - ./infra/mysql/ticket:/docker-entrypoint-initdb.d:ro

  notification-db:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: notification
    ports:
      - "3311:3306"
    volumes:
      - notification-db-data:/var/lib/mysql
      - ./infra/mysql/notification:/docker-entrypoint-initdb.d:ro

  # --- Redis (ADR 001: two instances with different policies) ----------------
  # catalog-cache: a cache may evict data (LRU) and needs no persistence.
  catalog-cache:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [flashtix-net]

  # hold-store: holds must NEVER be evicted (noeviction) and survive a restart (AOF).
  hold-store:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6380:6379"
    volumes:
      - hold-store-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [flashtix-net]

  # --- Message broker (ADR 003, INF-4) ---------------------------------------
  # The topology (exchanges, quorum queues, retry ladder and DLQs) lives in
  # definitions.json, generated with "npm run rabbitmq:definitions" and imported by the
  # rabbitmq-init container below.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-flashtix.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [flashtix-net]

  # Imports the topology once the broker answers, then exits ("exited (0)" is expected).
  # Re-importing is harmless, so this runs again on every "docker compose up".
  rabbitmq-init:
    image: rabbitmq:3.13-management-alpine
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./infra/rabbitmq/definitions.json:/definitions.json:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 30); do
          if rabbitmqadmin -H rabbitmq -u "$$RABBITMQ_USER" -p "$$RABBITMQ_PASSWORD" import /definitions.json; then
            echo "topology imported"
            exit 0
          fi
          echo "waiting for the management API..."
          sleep 2
        done
        echo "could not import the topology"
        exit 1
    restart: "no"
    networks: [flashtix-net]

  # --- Object storage for ticket PDFs (INF-3) --------------------------------
  # S3-compatible store for the ticket PDFs (C4 container "ticket-files").
  # NOTE: the design documents say MinIO, but MinIO no longer publishes a community
  # image that can be pulled without credentials. This is an S3 stand-in for
  # development; the service name stays implementation-neutral so that moving to real
  # object storage is a change of image. See docs/infrastructure.md.
  ticket-files:
    image: adobe/s3mock:3.12.0
    environment:
      debug: "false"
    ports:
      - "9090:9090"     # S3 API
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [flashtix-net]

  # Creates the bucket once and exits. "docker compose ps" shows it as "exited (0)".
  # Uses node because the busybox wget in the other images cannot send a PUT.
  ticket-files-init:
    image: node:20-alpine
    depends_on:
      ticket-files:
        condition: service_healthy
    environment:
      TICKET_BUCKET: ${TICKET_BUCKET}
    entrypoint:
      - node
      - -e
      - |
        const req = require('http').request(
          { host: 'ticket-files', port: 9090, path: '/' + process.env.TICKET_BUCKET, method: 'PUT' },
          (res) => {
            const ok = res.statusCode < 400;
            console.log((ok ? 'bucket ready: ' : 'could not create bucket: ') + process.env.TICKET_BUCKET + ' (HTTP ' + res.statusCode + ')');
            process.exit(ok ? 0 : 1);
          },
        );
        req.on('error', (err) => { console.error(err.message); process.exit(1); });
        req.end();
    restart: "no"
    networks: [flashtix-net]

  # --- Mail catcher (INF-6) ---------------------------------------------------
  # The Notification Worker sends SMTP here in development; nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [flashtix-net]

  # --- Legacy payment gateway mock (INF-5) ------------------------------------
  # Built from the monorepo: proves that a service can import @flashtix/shared.
  payment-gateway-mock:
    build:
      context: .
      dockerfile: tools/payment-gateway-mock/Dockerfile
    environment:
      MOCK_PORT: 8080
      MOCK_LATENCY_MIN_MS: ${MOCK_LATENCY_MIN_MS}
      MOCK_LATENCY_MAX_MS: ${MOCK_LATENCY_MAX_MS}
      MOCK_DECLINE_RATE: ${MOCK_DECLINE_RATE}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE}
      MOCK_TIMEOUT_RATE: ${MOCK_TIMEOUT_RATE}
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [flashtix-net]

  # --- Identity provider (INF-2) ----------------------------------------------
  # Realm, roles and test users are imported from infra/keycloak/flashtix-realm.json.
  # The realm pins its RSA signing key so the gateway can verify tokens with a key we
  # control instead of one regenerated on every import.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/flashtix-realm.json:/opt/keycloak/data/import/flashtix-realm.json:ro
    ports:
      - "8080:8080"     # issuer URL pinned in infra/kong/kong.yml
      - "9000:9000"     # management and health
    healthcheck:
      # The Keycloak image ships no curl or wget, so this talks to the port directly.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [flashtix-net]

  # --- API Gateway (GW-1 to GW-4) -----------------------------------------------
  # Single entry point. DB-less: infra/kong/kong.yml is the whole configuration.
  api-gateway:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: notice
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"     # public API
      - "8001:8001"     # admin API (read-only in DB-less mode)
    depends_on:
      catalog:
        condition: service_healthy
      reservation:
        condition: service_healthy
      waiting-room:
        condition: service_healthy
      order:
        condition: service_healthy
      ticket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [flashtix-net]

  # --- Catalog Service (CAT-1 to CAT-5) ----------------------------------------
  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      PORT: 3000
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CATALOG_CACHE_URL: redis://catalog-cache:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "3001:3000"
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-cache:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [flashtix-net]

  # --- Reservation Service (RES-1, RES-2, RES-3, RES-6) -------------------------
  reservation:
    build:
      context: .
      dockerfile: services/reservation/Dockerfile
    environment:
      PORT: 3000
      HOLD_STORE_URL: redis://hold-store:6379
      HOLD_TTL_SECONDS: 600
      HOLD_LOCK_SECONDS: 300
      HOLD_SWEEP_INTERVAL_MS: 5000
      GRPC_PORT: 50051
      ADMISSION_TOKEN_SECRET: ${ADMISSION_TOKEN_SECRET}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "3002:3000"
    depends_on:
      hold-store:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [flashtix-net]

  # --- Order Service (ORD-1 to ORD-7) ---------------------------------------------
  # Checkout saga orchestrator. Owns booking-db, the source of truth for every sale.
  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    environment:
      PORT: 3000
      BOOKING_DB_HOST: booking-db
      BOOKING_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RESERVATION_GRPC_URL: reservation:50051
      CATALOG_URL: http://catalog:3000
    ports:
      - "3003:3000"
    depends_on:
      booking-db:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      reservation:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [flashtix-net]

  # --- Waiting Room Service (WR-1 to WR-5) -------------------------------------
  # Virtual queue in hold-store. Signs the admission token that POST /holds requires.
  waiting-room:
    build:
      context: .
      dockerfile: services/waiting-room/Dockerfile
    environment:
      PORT: 3000
      HOLD_STORE_URL: redis://hold-store:6379
      CATALOG_URL: http://catalog:3000
      ADMISSION_TOKEN_SECRET: ${ADMISSION_TOKEN_SECRET}
      ADMISSION_BATCH_SIZE: ${ADMISSION_BATCH_SIZE}
      ADMISSION_INTERVAL_MS: ${ADMISSION_INTERVAL_MS}
      ADMISSION_TOKEN_TTL_SECONDS: 600
    ports:
      - "3004:3000"
    depends_on:
      hold-store:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [flashtix-net]

  # --- Payment Worker (PAY-1 to PAY-5) -----------------------------------------
  # No public API: consumes payment.requested / refund.requested and calls the legacy
  # gateway with timeout, retries and a circuit breaker.
  payment-worker:
    build:
      context: .
      dockerfile: services/payment-worker/Dockerfile
    environment:
      PORT: 3000
      PAYMENT_DB_HOST: payment-db
      PAYMENT_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      PAYMENT_GATEWAY_URL: http://payment-gateway-mock:8080
      PAYMENT_GATEWAY_TIMEOUT_MS: 20000
      PAYMENT_RETRY_DELAYS_MS: ${PAYMENT_RETRY_DELAYS_MS}
      PAYMENT_CONCURRENCY: 50
    ports:
      - "3005:3000"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      payment-gateway-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [flashtix-net]

  # --- Ticket Service (feature F5) ---------------------------------------------
  # Consumes order.confirmed, issues one PDF + QR ticket per seat, stores the PDF in the
  # S3 bucket and publishes ticket.issued. Serves GET /v1/tickets/{id} through the gateway.
  ticket:
    build:
      context: .
      dockerfile: services/ticket/Dockerfile
    environment:
      PORT: 3000
      TICKET_DB_HOST: ticket-db
      TICKET_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CATALOG_URL: http://catalog:3000
      TICKET_QR_SECRET: ${TICKET_QR_SECRET}
      TICKET_BUCKET: ${TICKET_BUCKET}
      S3_ENDPOINT: http://ticket-files:9090
      # The download link is opened by the browser of the fan, so it is signed for the host port.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9090}
    ports:
      - "3006:3000"
    depends_on:
      ticket-db:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      ticket-files-init:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [flashtix-net]

  # --- Notification Worker (feature F5) -----------------------------------------
  # No public API: consumes ticket.issued, order.failed and order.cancelled and emails the
  # fan through Mailpit (SMTP), once per dedup key.
  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      PORT: 3000
      NOTIFICATION_DB_HOST: notification-db
      NOTIFICATION_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-FlashTix <no-reply@flashtix.test>}
      TICKET_BUCKET: ${TICKET_BUCKET}
      S3_ENDPOINT: http://ticket-files:9090
    ports:
      - "3007:3000"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      ticket-files-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [flashtix-net]

networks:
  flashtix-net:

volumes:
  catalog-db-data:
  booking-db-data:
  payment-db-data:
  ticket-db-data:
  notification-db-data:
  hold-store-data:
  rabbitmq-data:
